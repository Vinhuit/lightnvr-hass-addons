worker_processes auto;
pid /run/lightnvr-ingress.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map $uri $lightnvr_backend {
        ~^/go2rtc/ http://127.0.0.1:1984;
        default http://127.0.0.1:8080;
    }
    map $http_x_ingress_path $lightnvr_ingress_prefix {
        ~^/api/(hassio_ingress|ingress)/[A-Za-z0-9_-]+$ $http_x_ingress_path;
        default "";
    }
    map $http_x_forwarded_proto $addon_forwarded_proto {
        https https;
        http http;
        default $scheme;
    }
    server {
        listen 8099;
        # Home Assistant's Supervisor is the only Ingress caller.
        allow 172.30.32.2;
        deny all;
        client_max_body_size 64m;

        location = /ytstream {
            return 302 $lightnvr_ingress_prefix/ytstream/;
        }
        location /ytstream/ {
            proxy_pass http://127.0.0.1:8081/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $addon_forwarded_proto;
            proxy_set_header X-Forwarded-Prefix $lightnvr_ingress_prefix/ytstream;
            proxy_cookie_path / $lightnvr_ingress_prefix/ytstream/;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }

        location / {
            # go2rtc's WebSocket endpoint must bypass LightNVR's HTTP-only proxy.
            proxy_pass $lightnvr_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Ingress-Path $http_x_ingress_path;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Accept-Encoding "";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_redirect ~^(/.*)$ $lightnvr_ingress_prefix$1;
            proxy_cookie_path / $lightnvr_ingress_prefix/;

            # The pinned frontend uses some absolute navigation paths and, on
            # HTTP, direct go2rtc URLs. Keep those requests inside Ingress.
            sub_filter_once off;
            sub_filter_types application/javascript text/javascript;
            sub_filter '<head>' '<head><script src="$lightnvr_ingress_prefix/addon-ingress.js"></script>';
            sub_filter '"/index.html' '"$lightnvr_ingress_prefix/index.html';
            sub_filter '"/login.html' '"$lightnvr_ingress_prefix/login.html';
            sub_filter '"/recordings.html' '"$lightnvr_ingress_prefix/recordings.html';
            sub_filter '"/events.html' '"$lightnvr_ingress_prefix/events.html';
            sub_filter '"/faces.html' '"$lightnvr_ingress_prefix/faces.html';
            sub_filter '"/classification.html' '"$lightnvr_ingress_prefix/classification.html';
            sub_filter '"/settings.html' '"$lightnvr_ingress_prefix/settings.html';
            sub_filter '"/streams.html' '"$lightnvr_ingress_prefix/streams.html';
            sub_filter '"/system.html' '"$lightnvr_ingress_prefix/system.html';
            sub_filter '"/timeline.html' '"$lightnvr_ingress_prefix/timeline.html';
            sub_filter '"/users.html' '"$lightnvr_ingress_prefix/users.html';
            sub_filter '"/hls.html' '"$lightnvr_ingress_prefix/hls.html';
        }
        location = /addon-ingress.js {
            alias /usr/local/lib/lightnvr-addon/ingress.js;
            default_type application/javascript;
        }
    }
}
