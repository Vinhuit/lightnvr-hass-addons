configuration:
  retention_days:
    name: Recording retention (days)
    description: How many days to retain recordings. Applied when the add-on starts.
  log_level:
    name: Log level
  initial_admin_password:
    name: Initial admin password
    description: Used only on the first start. Leave empty to generate a password in the log.
  reset_admin_password:
    name: Reset existing admin password
    description: Set initial_admin_password and enable for recovery, then restart. Disable after login; while enabled, resets at each start.
  auth_enabled:
    name: Require LightNVR login
    description: Enabled by default. Disable to skip LightNVR login through Ingress and the direct web port. Home Assistant login still applies to Ingress.
  detection_server:
    name: Detection service URL
    description: Optional external HTTP(S) detection endpoint. AI service is installed separately.
  onvif_network:
    name: ONVIF camera network
    description: Optional IPv4 CIDR, such as 192.168.1.0/24.
  ytstream_server:
    name: YouTube sync URL
    description: Optional external ytstream sync endpoint. Omit to disable YouTube sync.
  webrtc_external_ip:
    name: WebRTC host IP
    description: Home Assistant host IP reachable by camera viewers.
network:
  8080/tcp: Optional direct LightNVR web interface (follows auth_enabled)
  8554/tcp: Optional RTSP restream
  8555/tcp: WebRTC media over TCP
  8555/udp: WebRTC media over UDP
